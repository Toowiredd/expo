# DISABLED AUTO-RUN: Originally triggered on auto-triggers
# Converted to manual execution only - 2025-10-18
# Backup available at: check-issues-nightly.yml.backup
name: Check issues with pending validation labels

on:
  workflow_dispatch:  # Manual trigger only
#   workflow_dispatch: {}
#   schedule:
#     - cron: '0 8 * * *' # 8:00 AM UTC time every day

jobs:
  validate-pending-issues:
    runs-on: ubuntu-22.04
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v4
      - name: ➕ Add `bin` to GITHUB_PATH
        run: echo "$(pwd)/bin" >> $GITHUB_PATH
      - name: ♻️ Restore caches
        uses: ./.github/actions/expo-caches
        id: expo-caches
        with:
          yarn-tools: 'true'
      - name: 🔎 Validate issues with pending labels
        run: expotools validate-issue --issue "*"
        env:
          GITHUB_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
