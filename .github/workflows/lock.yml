# Configuration for Lock Threads - https://github.com/dessant/lock-threads

# DISABLED AUTO-RUN: Originally triggered on auto-triggers
# Converted to manual execution only - 2025-10-18
# Backup available at: lock.yml.backup
name: 'Lock Threads'

on:
  workflow_dispatch:  # Manual trigger only
#   schedule:
#     - cron: '0 0 * * MON' # 0:00 AM UTC time every Monday
#   workflow_dispatch: {}

permissions:
  issues: write

concurrency:
  group: lock

jobs:
  action:
    runs-on: ubuntu-22.04
    steps:
      - uses: dessant/lock-threads@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-inactive-days: '180'
          add-issue-labels: 'outdated'
          exclude-any-issue-labels: 'help wanted'
          process-only: 'issues'
