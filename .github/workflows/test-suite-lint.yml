# DISABLED AUTO-RUN: Originally triggered on auto-triggers
# Converted to manual execution only - 2025-10-18
# Backup available at: test-suite-lint.yml.backup
name: Test Suite Lint

on:
  workflow_dispatch:  # Manual trigger only
#   workflow_dispatch: {}
#   push:
#     branches: [main]
#     paths:
#       - apps/test-suite/**
#   pull_request:
#     paths:
#       - apps/test-suite/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: ⬢ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: ♻️ Restore caches
        uses: ./.github/actions/expo-caches
        id: expo-caches
        with:
          yarn-workspace: 'true'
      - name: 🧶 Install workspace node modules
        if: steps.expo-caches.outputs.yarn-workspace-hit != 'true'
        run: yarn install --frozen-lockfile
      - name: 🚨 Lint test-suite files
        run: yarn lint --max-warnings 0
        working-directory: apps/test-suite
