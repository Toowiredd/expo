# DISABLED AUTO-RUN: Originally triggered on auto-triggers
# Converted to manual execution only - 2025-10-18
# Backup available at: fingerprint.yml.backup
name: Fingerprint

on:
  workflow_dispatch:  # Manual trigger only
#   push:
#     branches: [main, 'sdk-*']
#     paths:
#       - .github/workflows/fingerprint.yml
#       - packages/@expo/fingerprint/**
#       - packages/create-expo/**
#       - yarn.lock
#   pull_request:
#     paths:
#       - .github/workflows/fingerprint.yml
#       - packages/@expo/fingerprint/**
#       - packages/create-expo/**
#       - yarn.lock
#   schedule:
#     - cron: 0 14 * * *

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: ⬢ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: 🚀 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: ⬇️ Fetch commits from base branch
        run: git fetch origin ${{ github.event.before || github.base_ref || 'main' }}:${{ github.event.before || github.base_ref || 'main' }} --depth 100
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
      - name: ♻️ Restore caches
        uses: ./.github/actions/expo-caches
        id: expo-caches
        with:
          yarn-workspace: 'true'
      - name: 🧶 Install node modules in root dir
        if: steps.expo-caches.outputs.yarn-workspace-hit != 'true'
        run: yarn install --frozen-lockfile
      - name: E2E Test @expo/fingerprint
        run: bun test:e2e --ci --runInBand
        working-directory: packages/@expo/fingerprint
